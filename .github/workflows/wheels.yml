name: Build wheels

# Builds binary wheels (with the optional native `domainator._gbfast` Rust
# extension compiled in) for Linux and macOS, plus an sdist. Windows is not built:
# the pyhmmer/pyinfernal dependencies don't compile there. The extension uses the
# stable ABI, so there is one wheel per platform for every Python from 3.12 on.
# Wheels are uploaded as artifacts, and a pushed `v*` tag also publishes them to PyPI
# (the `publish` job), through PyPI trusted publishing: the PyPI project must list this
# repository, this workflow (wheels.yml) and the environment `pypi` as a trusted publisher.
#
# The extension is optional: if a user pip-installs the sdist on a platform with
# no prebuilt wheel and no Rust toolchain, the build still succeeds and domainator
# falls back to its pure-Python / gb-io parsing paths.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - "rust/**"
      - "pyproject.toml"
      - ".github/workflows/wheels.yml"

jobs:
  build_wheels:
    name: Wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.0.0
        # All cibuildwheel configuration lives in [tool.cibuildwheel] in
        # pyproject.toml (Python versions, Rust install, test command).

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pipx run build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: ./dist/*.tar.gz

  publish:
    name: Publish to PyPI
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
