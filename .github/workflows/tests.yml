name: Tests

# Runs the test suite on pull requests, and when started by hand (Actions > Tests > Run workflow).
#
# - `pip` jobs install only the Python dependencies; tests that need an external
#   program (diamond, cd-hit, usearch, foldseek, cmbuild, ...) skip themselves via the
#   `requires_binary` marker or their own skipif checks.
# - The `conda` job also installs those programs from bioconda, so the
#   binary-dependent tests run too. It runs the newest Python, 3.15, because conda-forge
#   has its compiled dependencies (h5py has no 3.15 wheel on PyPI yet).
# Tests that download from the internet are deselected (`-m "not network"`).

on:
  pull_request:
  workflow_dispatch:

jobs:
  pip:
    name: pip / ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # GitHub runners ship a Rust toolchain, so the optional native extension builds.
      - run: python -m pip install -e ".[test,projection]"
      - run: python -c "from domainator import _gbfast"
      - run: python -m pytest -m "not network" -ra

  conda:
    name: conda (with external programs)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: domainator
          create-args: >-
            -c conda-forge -c bioconda
            python=3.15 pip rust h5py numpy scipy pandas matplotlib-base scikit-learn numba cython
            cd-hit diamond foldseek usearch infernal ncbi-datasets-cli
      - run: python -m pip install -e ".[test,projection]"
      - run: python -m pytest -m "not network" -ra
