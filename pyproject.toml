[build-system]
requires = ["setuptools>=61.0.0", "packaging>=24.2", "wheel", "setuptools-rust>=1.7"]
build-backend = "setuptools.build_meta"

# Optional native acceleration (domainator._gbfast). `optional = true` means a
# missing Rust toolchain does not fail the install; the Python code falls back to
# the Biopython parser, so correctness never depends on this extension.
[[tool.setuptools-rust.ext-modules]]
target = "domainator._gbfast"
path = "rust/Cargo.toml"
binding = "PyO3"
optional = true
# Always build optimized (release), including for editable installs.
debug = false

[tool.cibuildwheel]
# Build CPython wheels for the supported versions; skip 32-bit and musl.
build = "cp310-* cp311-* cp312-* cp313-*"
skip = "*_i686 *-musllinux_*"
# Verify the native extension actually compiled into the wheel. domainator's
# __init__ is lightweight, so importing _gbfast does not pull the heavy runtime
# deps.
test-command = "python -c \"from domainator import _gbfast; assert hasattr(_gbfast, 'parse_lean_search') and hasattr(_gbfast, 'genbank_offsets')\""

[tool.cibuildwheel.linux]
# manylinux_2_28 ships a modern toolchain; install Rust into the build container.
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
before-all = "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal"
environment = { PATH = "$HOME/.cargo/bin:$PATH" }

[tool.cibuildwheel.macos]
# GitHub macOS runners have Rust preinstalled via rustup.
before-all = "rustup target add x86_64-apple-darwin aarch64-apple-darwin || true"

[project]
name="domainator"
authors = [
    {name = "Sean Johnson", email = "sjohnson@neb.com"},
    {name = "Andrew Ge"},
    {name = "Yu-Cheng Lin"},
    {name = "Zhiyi Sun"}
]
description="A flexible and modular software suite for domain-based gene neighborhood and protein search, extraction, and clustering."
readme = "README.md"
requires-python = ">=3.10,<3.14"

classifiers=[
    "Programming Language :: Python :: 3",
]
license = "MIT"
dynamic = ["version"]
dependencies = [
    # domainator.genbank subclasses private parts of Biopython's GenBank parser and writer;
    # test_genbank.py round-trips every fixture, so raise the upper bound after it passes.
    "biopython >=1.85,<1.89",
    "pandas >=2.1.0",
    "seaborn >=0.13.0",
    "scipy >=1.11.2",
    "pyhmmer>=0.12.0,<0.13.0",
    "pyinfernal >=0.1.0, <0.2.0",
    "umap-learn >=0.5.4",
    "h5py >=3.9.0",
    "jsonargparse >=4.18.0",
    "Flask >=2.3",
    "Werkzeug >=2.3",
    "psutil >=5.9.6",
    "tqdm >=4.65.0",
    "pyrodigal >=3.0.1",
    "bashplotlib >=0.6.5",
    "requests >=2.31.0",
    "urllib3 >=2.0",
    "shtab >=1.7"
]

[project.optional-dependencies]
core = [
    "pandas >=2.1.0",
    "seaborn >=0.13.0",
    "scipy >=1.11.2",
    "pyhmmer>=0.12.0,<0.13.0",
    "pyinfernal >=0.1.0, <0.2.0",
    "umap-learn >=0.5.4",
    "h5py >=3.9.0",
    "jsonargparse >=4.18.0",
    "psutil >=5.9.6",
    "tqdm >=4.65.0",
    "pyrodigal >=3.0.1",
    "bashplotlib >=0.6.5",
    "requests >=2.31.0",
    "urllib3 >=2.0",
    "shtab >=1.7"
]
test = ["pytest >=7.4.2",
        "pytest-datadir~=1.4.1"]
# Browser-driven regression tests for the Domainator Similarity Network Viewer HTML. Not part of `test`
# because Playwright also needs a one-time browser download:
#   pip install -e ".[test,browser]" && playwright install chromium
# The tests in test/test_ssn_viewer_browser.py skip automatically when the
# `playwright` package is not importable.
browser = ["pytest-playwright >=0.4.0"]
# add dependency for Foldseek/ESM2 related stuff.

[project.urls]
Bug_Tracker = "https://github.com/nebiolabs/domainator/issues"


[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.package-data]
"domainator.server" = [
    "static/*.css",
    "static/*.js",
    "static/*.json",
    "static/*.svg",
    "templates/*.html",
    "schemas/**/*.json",
]


[tool.setuptools.dynamic]
version = {attr = "domainator.__version__"}

[tool.pytest.ini_options]
testpaths = ["test"]
# Most tests copy test/data into tmp_path (via shared_datadir), about 11 GB per full run;
# keep only the directories of failed tests.
tmp_path_retention_policy = "failed"
markers = [
    "requires_binary(*names): skip unless every named external program is on PATH (see test/conftest.py)",
    "network: downloads from the internet; deselect with -m 'not network'",
]
# Domainator's own FutureWarnings mark deprecated usage that the suite must not rely on.
filterwarnings = [
    "error::FutureWarning:domainator.*",
]

[project.scripts]
"domainator" = "domainator.cli:main"
"domainator_server" = "domainator.server.cli:main"
