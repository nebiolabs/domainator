[build-system]
requires = ["setuptools>=77", "packaging>=24.2", "wheel", "setuptools-rust>=1.7"]
build-backend = "setuptools.build_meta"

# Optional native acceleration (domainator._gbfast). `optional = true` means a
# missing Rust toolchain does not fail the install; the Python code falls back to
# the Biopython parser, so correctness never depends on this extension.
[[tool.setuptools-rust.ext-modules]]
target = "domainator._gbfast"
path = "rust/Cargo.toml"
binding = "PyO3"
optional = true
# Always build optimized (release), including for editable installs.
debug = false
# Built against the stable ABI when setup.py asks for it (every Python from 3.12 on, except
# free-threaded builds, which the stable ABI doesn't cover before 3.15).
py-limited-api = "auto"

[tool.cibuildwheel]
# One abi3 wheel per platform (see setup.py); skip 32-bit and musl.
build = "cp312-*"
skip = "*_i686 *-musllinux_*"
# Verify the native extension actually compiled into the wheel. domainator's
# __init__ is lightweight, so importing _gbfast does not pull the heavy runtime
# deps.
test-command = "python -c \"from domainator import _gbfast; assert hasattr(_gbfast, 'parse_lean_search') and hasattr(_gbfast, 'genbank_offsets')\""

[tool.cibuildwheel.linux]
# manylinux_2_28 ships a modern toolchain; install Rust into the build container.
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
before-all = "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal"
environment = { PATH = "$HOME/.cargo/bin:$PATH" }

[tool.cibuildwheel.macos]
# GitHub macOS runners have Rust preinstalled via rustup.
before-all = "rustup target add x86_64-apple-darwin aarch64-apple-darwin || true"

[project]
name = "domainator"
authors = [
    {name = "Sean Johnson", email = "sjohnson@neb.com"},
    {name = "Andrew Ge"},
    {name = "Yu-Cheng Lin"},
    {name = "Zhiyi Sun"}
]
description = "A flexible and modular software suite for domain-based gene neighborhood and protein search, extraction, and clustering."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE.txt"]
keywords = ["bioinformatics", "protein domains", "HMMER", "genome neighborhoods", "sequence similarity networks", "GenBank"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Rust",
]
dynamic = ["version"]
# The floors are the first releases with Python 3.12 support (or that Domainator needs).
dependencies = [
    # domainator.genbank subclasses private parts of Biopython's GenBank parser and writer;
    # test_genbank.py round-trips every fixture, so raise the upper bound after it passes.
    "biopython >=1.85,<1.89",
    "numpy >=1.26",
    "scipy >=1.11.2",
    "pandas >=2.1.1",
    "matplotlib >=3.8",
    "seaborn >=0.13",
    "scikit-learn >=1.3.1",
    "numba >=0.59",
    "h5py >=3.10",
    "pyhmmer >=0.12.0,<0.13",
    "pyinfernal >=0.1.0,<0.2",
    "pyrodigal >=3.0.1",
    "jsonargparse >=4.49",
    "shtab >=1.7",
    "psutil >=5.9.6",
    "tqdm >=4.65",
    "requests >=2.31",
    "urllib3 >=2.0",
]

[project.optional-dependencies]
# build_projection --algorithm umap
projection = ["umap-learn >=0.5.4"]
# domainate --foldseek and find_features --tmbed. They also need packages that are not on PyPI:
# esmologs (see docs/esm_3b_foldseek.md) and TMbed (see "Optional: TMbed" in README.md).
structure = ["torch >=2.0"]
test = ["pytest >=7.4",
        "pytest-datadir >=1.4.1"]
# Browser-driven regression tests for the Domainator Similarity Network Viewer HTML. Not part of `test`
# because Playwright also needs a one-time browser download:
#   pip install -e ".[test,browser]" && playwright install chromium
# The tests in test/test_ssn_viewer_browser.py skip automatically when the
# `playwright` package is not importable.
browser = ["pytest-playwright >=0.4.0"]
# The documentation site (mkdocs.yml): mkdocs build
docs = ["mkdocs >=1.6,<2", "mkdocs-material >=9.5", "mkdocstrings[python] >=0.26"]
dev = ["domainator[test,browser,projection,docs]", "coverage"]

[project.urls]
Homepage = "https://github.com/nebiolabs/domainator"
Documentation = "https://nebiolabs.github.io/domainator/"
Changelog = "https://github.com/nebiolabs/domainator/blob/main/CHANGELOG.md"
Issues = "https://github.com/nebiolabs/domainator/issues"
Paper = "https://doi.org/10.1093/nar/gkae1175"


[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.package-data]
# The SSN viewer's page sources (read by ssn_viewer_html.py) and the reports' (report_html.py).
domainator = ["ssn_viewer/*.html", "ssn_viewer/*.css", "ssn_viewer/js/*.js", "web/common/*", "web/reports/*"]

[tool.setuptools.dynamic]
version = {attr = "domainator.__version__"}

[tool.pytest.ini_options]
testpaths = ["test"]
# Most tests copy test/data into tmp_path (via shared_datadir), about 11 GB per full run;
# keep only the directories of failed tests.
tmp_path_retention_policy = "failed"
markers = [
    "requires_binary(*names): skip unless every named external program is on PATH (see test/conftest.py)",
    "network: downloads from the internet; deselect with -m 'not network'",
]
# Domainator's own FutureWarnings mark deprecated usage that the suite must not rely on.
filterwarnings = [
    "error::FutureWarning:domainator.*",
]

[project.scripts]
"domainator" = "domainator.cli:main"
