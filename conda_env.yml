name: domainator
channels:
  - conda-forge
  - bioconda
dependencies:
  - python>=3.12
  - pip>=23.3
  - setuptools>=77
  - rust>=1.83  # PyO3 0.29 requires Rust >= 1.83
  - cd-hit>=4.8.1,<5.0
  - diamond>=2.2.5,<3.0
  - foldseek>=10.941cd33
  - infernal>=1.1.5  # cmbuild, for domainator infernal_build
  - usearch>=12.0_beta,<13.0
  - ncbi-datasets-cli
  - pip:
    - -e .[test,projection]
    # find_features --tmbed; not on PyPI, so pinned to a commit
    - git+https://github.com/BernhoferM/TMbed.git@8cee893523eb655bc9485c00c65336d27a236191
