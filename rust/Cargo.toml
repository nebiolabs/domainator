[package]
name = "domainator-gbfast"
version = "0.1.0"
edition = "2021"
description = "Fast GenBank offset scanner and parser for Domainator (optional native acceleration)."
license = "MIT"

[lib]
name = "_gbfast"
crate-type = ["cdylib"]

[dependencies]
# abi3-py312: one build works on every Python from 3.12 on (the stable ABI).
pyo3 = { version = "0.29.0", features = ["extension-module", "abi3-py312"] }
gb-io = "0.9"
bgzf = "0.3"
libdeflater = "1.25"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
